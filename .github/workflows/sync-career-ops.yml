name: Sync career-ops releases

# Applies published career-ops-hq releases onto this fork with
# update-system.mjs. The release channel is the one apply() installs:
# merges that have not been released yet are left alone.
#
# Never pass --force. A default apply keeps system files this fork has
# changed (including this workflow) and skips upstream changes to them.
# --force would replace those files with the upstream copy.

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-career-ops
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check for a newer career-ops release
        id: check
        run: |
          set -euo pipefail
          node update-system.mjs check --force | tee "$RUNNER_TEMP/career-ops-update.json"
          node --input-type=module -e "
            import { readFileSync, appendFileSync } from 'node:fs';
            const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/career-ops-update.json', 'utf8'));
            const line = (key, value) => appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + value + '\n');
            line('status', report.status);
            if (report.local) line('local', report.local);
            if (report.remote) line('remote', report.remote);
          "

      - name: Stop when the release check did not succeed
        if: steps.check.outputs.status != 'up-to-date' && steps.check.outputs.status != 'update-available'
        run: |
          echo "update check status: ${{ steps.check.outputs.status }}"
          exit 1

      - name: Apply the release
        if: steps.check.outputs.status == 'update-available'
        env:
          CAREER_OPS_NPM_INSTALL_TIMEOUT_MS: '300000'
          CAREER_OPS_PLAYWRIGHT_INSTALL_TIMEOUT_MS: '300000'
          CAREER_OPS_GIT_FETCH_TIMEOUT_MS: '300000'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node update-system.mjs apply --confirm
          # web/ is not on the updater manifest. Make the tracked tree match
          # the release: checkout updates and additions, then delete tracked
          # files the release no longer has. checkout alone leaves those
          # behind. Personal data is not under web/.
          if git cat-file -e FETCH_HEAD:web >/dev/null 2>&1; then
            git checkout FETCH_HEAD -- web
            comm -23 \
              <(git ls-files -- web | LC_ALL=C sort) \
              <(git ls-tree -r --name-only FETCH_HEAD -- web | LC_ALL=C sort) \
              > "$RUNNER_TEMP/web-removed.txt"
            if [ -s "$RUNNER_TEMP/web-removed.txt" ]; then
              git rm -q --pathspec-from-file="$RUNNER_TEMP/web-removed.txt" --
            fi
            if ! git diff --cached --quiet -- web; then
              if git merge-base --is-ancestor HEAD origin/main; then
                version="$(tr -d '[:space:]' < VERSION)"
                git commit -m "chore: auto-update system files to v${version}"
              else
                git commit --amend --no-edit
              fi
            fi
          fi
          git cat-file -e "HEAD:.github/workflows/sync-career-ops.yml"

      - name: Open a pull request
        if: steps.check.outputs.status == 'update-available'
        env:
          GH_TOKEN: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          LOCAL: ${{ steps.check.outputs.local }}
          REMOTE: ${{ steps.check.outputs.remote }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "apply produced no new commit"
            exit 0
          fi
          branch="chore/career-ops-v${REMOTE}"
          git checkout -B "$branch"
          git push --force-with-lease origin "HEAD:${branch}"
          existing="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "pull request #${existing} already open for ${branch}"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync career-ops to v${REMOTE}" \
            --body "Applies the published career-ops release v${LOCAL} → v${REMOTE}. System files and web/. CV, profile, tracker, reports, and .career-ops-web/ are left untouched."
