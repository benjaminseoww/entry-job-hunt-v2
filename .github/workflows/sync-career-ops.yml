name: Sync career-ops releases

# Merges a published career-ops-hq release tag into benjaminseoww/entry-job-hunt-v2
# main. The pull request always targets that main. Commits on career-ops main
# that are not in a release yet are left alone.
#
# Merge the sync pull request with a merge commit. A squash would drop
# upstream's history, and every later sync would conflict again on changes
# this fork already took.
#
# When the merge conflicts, user-layer paths are put back to this fork and
# Copilot CLI gets one try at the rest, following
# .github/skills/resolve-sync-conflicts/SKILL.md. The pull request lists
# every conflicted path and how that try handled it. A try that leaves
# markers, fails lint or tests, or does not run stays a draft with the
# markers. Set the COPILOT_GITHUB_TOKEN secret (fine-grained PAT, account
# permission Copilot Requests: Read) or the try is skipped.
# An open sync pull request is never force-pushed, so a resolution in
# progress on that branch is safe.

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-career-ops
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORK_REPO: benjaminseoww/entry-job-hunt-v2
      FORK_BRANCH: main
      UPSTREAM_REPO: career-ops-hq/career-ops
    steps:
      - uses: actions/checkout@v7
        with:
          repository: benjaminseoww/entry-job-hunt-v2
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check for a newer career-ops release
        id: check
        run: |
          set -euo pipefail
          node update-system.mjs check --force | tee "$RUNNER_TEMP/career-ops-update.json"
          node --input-type=module -e "
            import { readFileSync, appendFileSync } from 'node:fs';
            const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/career-ops-update.json', 'utf8'));
            const line = (key, value) => appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + value + '\n');
            line('status', report.status);
            if (report.local) line('local', report.local);
            if (report.remote) line('remote', report.remote);
          "

      - name: Stop when the release check did not succeed
        if: steps.check.outputs.status != 'up-to-date' && steps.check.outputs.status != 'update-available'
        run: |
          echo "update check status: ${{ steps.check.outputs.status }}"
          exit 1

      - name: Skip when a sync pull request is already open
        id: open
        if: steps.check.outputs.status == 'update-available'
        env:
          GH_TOKEN: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          REMOTE: ${{ steps.check.outputs.remote }}
        run: |
          set -euo pipefail
          branch="chore/career-ops-v${REMOTE}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          existing="$(gh pr list --repo "$FORK_REPO" --base "$FORK_BRANCH" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "pull request #${existing} already open for ${branch}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the release
        id: merge
        if: steps.check.outputs.status == 'update-available' && steps.open.outputs.skip != 'true'
        env:
          REMOTE: ${{ steps.check.outputs.remote }}
          BRANCH: ${{ steps.open.outputs.branch }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bash .github/scripts/finish-sync-merge.sh

      - name: Open a pull request
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          LOCAL: ${{ steps.check.outputs.local }}
          REMOTE: ${{ steps.check.outputs.remote }}
          BRANCH: ${{ steps.open.outputs.branch }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
        run: |
          set -euo pipefail
          git push --force origin "HEAD:${BRANCH}"
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Merges the published career-ops release v${LOCAL} → v${REMOTE} into \`benjaminseoww/entry-job-hunt-v2\` \`${FORK_BRANCH}\`. The release tag is compared with that branch. Your own edits stay; files only this fork has are untouched."
            echo
            echo "Merge with **Create a merge commit** so the release history stays in entry-job-hunt-v2 \`${FORK_BRANCH}\`."
          } > "$body"
          if [ -f "$RUNNER_TEMP/conflict-notes.md" ]; then
            echo >> "$body"
            cat "$RUNNER_TEMP/conflict-notes.md" >> "$body"
          fi
          if [ "$CONFLICTED" = "true" ]; then
            {
              echo
              echo "Markers still on the branch are the files marked not handled above. Edit those, delete the markers, then:"
              echo
              echo '```bash'
              echo "git fetch origin && git checkout ${BRANCH}"
              echo "git commit -am \"resolve career-ops v${REMOTE} merge conflicts\" && git push"
              echo '```'
              echo
              echo "Then mark this pull request ready for review."
            } >> "$body"
            gh pr create --repo "$FORK_REPO" --draft --base "$FORK_BRANCH" --head "$BRANCH" \
              --title "chore: sync career-ops v${REMOTE} into entry-job-hunt-v2 main (conflicts)" --body-file "$body"
          else
            gh pr create --repo "$FORK_REPO" --base "$FORK_BRANCH" --head "$BRANCH" \
              --title "chore: sync career-ops v${REMOTE} into entry-job-hunt-v2 main" --body-file "$body"
          fi
