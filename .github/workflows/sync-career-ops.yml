name: Sync career-ops releases

# Applies published career-ops-hq releases onto this fork with
# update-system.mjs. The release channel is the one apply() installs:
# merges that have not been released yet are left alone.
#
# Never pass --force. A default apply keeps system files this fork has
# changed (including this workflow) and skips upstream changes to them.
# --force would replace those files with the upstream copy.

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-career-ops
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check for a newer career-ops release
        id: check
        run: |
          set -euo pipefail
          node update-system.mjs check --force | tee "$RUNNER_TEMP/career-ops-update.json"
          node --input-type=module -e "
            import { readFileSync, appendFileSync } from 'node:fs';
            const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/career-ops-update.json', 'utf8'));
            const line = (key, value) => appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + value + '\n');
            line('status', report.status);
            if (report.local) line('local', report.local);
            if (report.remote) line('remote', report.remote);
          "

      - name: Stop when the release check did not succeed
        if: steps.check.outputs.status != 'up-to-date' && steps.check.outputs.status != 'update-available'
        run: |
          echo "update check status: ${{ steps.check.outputs.status }}"
          exit 1

      - name: Apply the release
        if: steps.check.outputs.status == 'update-available'
        env:
          CAREER_OPS_NPM_INSTALL_TIMEOUT_MS: '300000'
          CAREER_OPS_PLAYWRIGHT_INSTALL_TIMEOUT_MS: '300000'
          CAREER_OPS_GIT_FETCH_TIMEOUT_MS: '300000'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node update-system.mjs apply --confirm
          # apply() only checks out SYSTEM_PATHS, and it skips a system file
          # this fork has edited. Dotfiles such as .gitignore never join that
          # list. This pass makes every other tracked path match the release
          # FETCH_HEAD still points at: checkout what the release has, delete
          # what it no longer has. User-layer paths (DATA_CONTRACT.md, plus
          # config/local-paths.txt) are left as they are. A new file this fork
          # owns belongs in config/local-paths.txt. An edit to a file the
          # release also ships belongs in FORK_KEEP below, or the next sync
          # replaces it.
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import {
            configuredTemplateVariantsFromProfileSource,
            effectiveUserPaths,
            isGeneratedTemplateArtifact,
            isUserConfiguredTemplateVariant,
          } from './update-system.mjs';

          const git = (args) => execFileSync('git', args, { encoding: 'utf8' });
          const lines = (args) => git(args).split('\n').filter(Boolean);
          // Fork edits the release also ships, or files the release does not
          // have, that this sync must not replace or delete.
          const FORK_KEEP = new Set([
            '.github/workflows/sync-career-ops.yml',
            '.github/workflows/plugin-registry-validate.yml',
            'classify-tier.mjs',
            'tests/classify-tier-position.test.mjs',
          ]);
          // System scaffolds that live inside a user-layer directory.
          const SYSTEM_INSIDE_USER = new Set([
            'writing-samples/README.md',
            'documents/README.md',
            'documents/.gitkeep',
            'interview-prep/sessions/README.md',
            'interview-prep/sessions/.gitkeep',
          ]);
          let variants = {};
          try {
            variants = configuredTemplateVariantsFromProfileSource(readFileSync('config/profile.yml', 'utf8'));
          } catch { /* no profile yet */ }
          const userSpecs = effectiveUserPaths();
          const kept = (path) => {
            if (FORK_KEEP.has(path)) return true;
            if (SYSTEM_INSIDE_USER.has(path)) return false;
            if (isGeneratedTemplateArtifact(path)) return true;
            if (isUserConfiguredTemplateVariant(path, variants)) return true;
            return userSpecs.some((spec) => spec.endsWith('/') ? path.startsWith(spec) : path === spec);
          };
          const release = new Set(lines(['ls-tree', '-r', '--name-only', 'FETCH_HEAD']));
          const local = lines(['ls-files']);
          const checkout = [...release].filter((path) => !kept(path));
          const remove = local.filter((path) => !release.has(path) && !kept(path));
          const out = process.env.RUNNER_TEMP;
          writeFileSync(`${out}/sync-checkout.txt`, checkout.join('\n'));
          writeFileSync(`${out}/sync-remove.txt`, remove.join('\n'));
          console.log(`release paths to checkout: ${checkout.length}`);
          console.log(`tracked paths to delete: ${remove.length}`);
          for (const path of remove) console.log(`  delete ${path}`);
          EOF
          if [ -s "$RUNNER_TEMP/sync-checkout.txt" ]; then
            git checkout FETCH_HEAD --pathspec-from-file="$RUNNER_TEMP/sync-checkout.txt"
          fi
          if [ -s "$RUNNER_TEMP/sync-remove.txt" ]; then
            git rm -q --pathspec-from-file="$RUNNER_TEMP/sync-remove.txt"
          fi
          if ! git diff --cached --quiet; then
            if git merge-base --is-ancestor HEAD origin/main; then
              version="$(tr -d '[:space:]' < VERSION)"
              git commit -m "chore: auto-update system files to v${version}"
            else
              git commit --amend --no-edit
            fi
          fi
          git cat-file -e "HEAD:.github/workflows/sync-career-ops.yml"

      - name: Open a pull request
        if: steps.check.outputs.status == 'update-available'
        env:
          GH_TOKEN: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          LOCAL: ${{ steps.check.outputs.local }}
          REMOTE: ${{ steps.check.outputs.remote }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "apply produced no new commit"
            exit 0
          fi
          branch="chore/career-ops-v${REMOTE}"
          git checkout -B "$branch"
          git push --force-with-lease origin "HEAD:${branch}"
          existing="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "pull request #${existing} already open for ${branch}"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync career-ops to v${REMOTE}" \
            --body "Applies the published career-ops release v${LOCAL} → v${REMOTE}. Every tracked path matches the release except the user layer (CV, profile, tracker, reports, and the rest of DATA_CONTRACT.md). Files listed in config/local-paths.txt are left untouched."
