name: Sync career-ops releases

# Merges each published career-ops-hq release into this fork with git, so
# upstream changes and this fork's own edits are combined instead of one
# replacing the other. The release channel is the one update-system.mjs
# installs: merges to upstream main that have not been released yet are left
# alone.
#
# Merge the sync pull request with a merge commit. A squash would drop
# upstream's history, and every later sync would conflict again on changes
# this fork already took.
#
# When the merge conflicts, the branch carries the conflict markers and the
# pull request opens as a draft listing the files. An open sync pull request
# is never force-pushed, so a resolution in progress on that branch is safe.

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-career-ops
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check for a newer career-ops release
        id: check
        run: |
          set -euo pipefail
          node update-system.mjs check --force | tee "$RUNNER_TEMP/career-ops-update.json"
          node --input-type=module -e "
            import { readFileSync, appendFileSync } from 'node:fs';
            const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/career-ops-update.json', 'utf8'));
            const line = (key, value) => appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + value + '\n');
            line('status', report.status);
            if (report.local) line('local', report.local);
            if (report.remote) line('remote', report.remote);
          "

      - name: Stop when the release check did not succeed
        if: steps.check.outputs.status != 'up-to-date' && steps.check.outputs.status != 'update-available'
        run: |
          echo "update check status: ${{ steps.check.outputs.status }}"
          exit 1

      - name: Skip when a sync pull request is already open
        id: open
        if: steps.check.outputs.status == 'update-available'
        env:
          GH_TOKEN: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          REMOTE: ${{ steps.check.outputs.remote }}
        run: |
          set -euo pipefail
          branch="chore/career-ops-v${REMOTE}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          existing="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "pull request #${existing} already open for ${branch}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the release
        id: merge
        if: steps.check.outputs.status == 'update-available' && steps.open.outputs.skip != 'true'
        env:
          REMOTE: ${{ steps.check.outputs.remote }}
          BRANCH: ${{ steps.open.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="career-ops-v${REMOTE}"
          git fetch --no-tags https://github.com/career-ops-hq/career-ops.git "+refs/tags/${tag}:refs/tags/${tag}"
          git checkout -B "$BRANCH"
          if git merge --no-ff --no-edit -m "chore: merge career-ops v${REMOTE}" "$tag"; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --diff-filter=U -z > "$RUNNER_TEMP/conflicts.bin"
          if [ ! -s "$RUNNER_TEMP/conflicts.bin" ]; then
            echo "git merge failed without leaving conflicts"
            exit 1
          fi
          git add -A --pathspec-from-file="$RUNNER_TEMP/conflicts.bin" --pathspec-file-nul
          git commit --no-edit -m "chore: merge career-ops v${REMOTE} (conflicts unresolved)"
          tr '\0' '\n' < "$RUNNER_TEMP/conflicts.bin" > "$RUNNER_TEMP/conflicts.txt"
          echo "conflicted=true" >> "$GITHUB_OUTPUT"
          echo "conflicted files:"
          cat "$RUNNER_TEMP/conflicts.txt"

      - name: Open a pull request
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CAREER_OPS_SYNC_TOKEN }}
          LOCAL: ${{ steps.check.outputs.local }}
          REMOTE: ${{ steps.check.outputs.remote }}
          BRANCH: ${{ steps.open.outputs.branch }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
        run: |
          set -euo pipefail
          git push --force origin "HEAD:${BRANCH}"
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Merges the published career-ops release v${LOCAL} → v${REMOTE} with git. Upstream changes are combined with this fork's own edits; files only this fork has are untouched."
            echo
            echo "Merge with **Create a merge commit** so upstream's history stays in \`main\`."
          } > "$body"
          if [ "$CONFLICTED" = "true" ]; then
            {
              echo
              echo "## Conflicts to resolve"
              echo
              echo "Upstream and this fork changed the same lines in these files. They are committed with \`<<<<<<<\` / \`>>>>>>>\` markers:"
              echo
              sed 's/.*/- `&`/' "$RUNNER_TEMP/conflicts.txt"
              echo
              echo '```bash'
              echo "git fetch origin && git checkout ${BRANCH}"
              echo "# edit each file above: keep, combine, or drop each side, and delete the markers"
              echo "git commit -am \"resolve career-ops v${REMOTE} merge conflicts\" && git push"
              echo '```'
              echo
              echo "Then mark this pull request ready for review."
            } >> "$body"
            gh pr create --draft --base main --head "$BRANCH" \
              --title "chore: sync career-ops to v${REMOTE} (conflicts)" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync career-ops to v${REMOTE}" --body-file "$body"
          fi
